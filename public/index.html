<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CHATLINK :: SYS TERMINAL</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="crt">

        <!-- Title Bar -->
        <div class="titlebar">

            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>

            <span class="label">
                chatlink — sys terminal
            </span>

            <span class="status">
                <span class="pulse"></span>
                connected
            </span>

        </div>


        <!-- Boot Section -->
        <div class="boot">

            <span class="big">
                CHATLINK v1.0
            </span>

            boot sequence complete.
            type a handle to authenticate.

            

        </div>


        <!-- Main Layout -->
        <div class="body-grid">

            <!-- Users -->
            <div class="nodes">

                <h4>Active nodes</h4>

                <div id="users"></div>

            </div>


            <!-- Chat -->
            <div class="main">

                <!-- Username -->
                <div class="identity-row">

                    <input
                        id="username"
                        type="text"
                        placeholder="handle_"
                    >

                    <button id="joinButton">
                        connect
                    </button>

                    <button id="leaveButton">
                        disconnect
                    </button>

                </div>


                <!-- Messages -->
                <div id="messages"></div>


                <!-- Message Input -->
                <div class="send-row">

                    <span class="prompt-label">
                        $
                    </span>

                    <input
                        id="message"
                        type="text"
                        placeholder="type a message and hit send_"
                    >

                    <button id="sendButton">
                        send
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- Socket.IO -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Our JavaScript -->
    <script src="script.js"></script>

</body>

</html>
